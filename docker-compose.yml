services:
  postgres:
    image: "postgres:16"
    environment:
      - POSTGRES_USER=root
      - POSTGRES_PASSWORD=root
      - POSTGRES_DB=root
    ports:
      - 5433:5432
    volumes:
      - pgdata:/var/lib/postgresql
    networks:
      - backend

  app:
    image: golang:1.22
    command:
      - go
      - run
      - main.go
    volumes:
      - .:/app
    working_dir: /app
    ports:
      - 8080:8080
    depends_on:
      - postgres
    environment:
      - DB_HOST=postgres
      - DB_USER=root
      - DB_PASSWORD=root
      - DB_NAME=root
      - DB_PORT=5432
    networks:
      - backend

networks:
  backend:
    driver: bridge

volumes:
  pgdata: